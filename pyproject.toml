[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streampulse"
version = "1.0.0"
description = "Spotify StreamPulse - Data Warehousing & Mining System"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.36.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "mlxtend>=0.23.0",
    "openpyxl>=3.1.0",
    "joblib>=1.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
